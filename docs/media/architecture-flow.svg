<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 410" width="1160" height="410" role="img" aria-label="AquaGuard AI Multimodal Risk Fusion Architecture">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="pulse-line-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#b4f03a"/>
    </linearGradient>
    <linearGradient id="pulse-line-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: dashMove 1.8s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="1160" height="410" rx="16" fill="url(#arch-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Title Header -->
    <text x="32" y="38" fill="#f8fafc" font-size="16" font-weight="800" letter-spacing="0.3">
      MULTIMODAL BIOLOGICAL RISK FUSION ARCHITECTURE
    </text>
    <text x="32" y="58" fill="#94a3b8" font-size="12">
      Real-time vision pathology (55%) + Emerson water thermodynamics (45%) + pathogen-stress synergy multipliers
    </text>

    <!-- Animated Connectors -->
    <!-- Top Left -> Fusion -->
    <path id="p1" d="M 325 140 C 390 140, 390 205, 455 205" fill="none" stroke="url(#pulse-line-lime)" stroke-width="2.5" class="flow-dash"/>
    <!-- Bottom Left -> Fusion -->
    <path id="p2" d="M 325 305 C 390 305, 390 235, 455 235" fill="none" stroke="url(#pulse-line-amber)" stroke-width="2.5" class="flow-dash"/>
    <!-- Fusion -> Outputs -->
    <path id="p3" d="M 755 205 C 805 205, 805 130, 855 130" fill="none" stroke="#b4f03a" stroke-width="2.5" class="flow-dash"/>
    <path id="p4" d="M 755 220 L 855 220" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-dash"/>
    <path id="p5" d="M 755 235 C 805 235, 805 315, 855 315" fill="none" stroke="#a78bfa" stroke-width="2.5" class="flow-dash"/>

    <!-- Animated Signal Orbs -->
    <circle r="4.5" fill="#b4f03a" filter="url(#glow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 325 140 C 390 140, 390 205, 455 205"/>
    </circle>
    <circle r="4.5" fill="#f97316" filter="url(#glow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.4s" path="M 325 305 C 390 305, 390 235, 455 235"/>
    </circle>
    <circle r="4" fill="#b4f03a" filter="url(#glow)">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="0.8s" path="M 755 205 C 805 205, 805 130, 855 130"/>
    </circle>
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.0s" path="M 755 220 L 855 220"/>
    </circle>
    <circle r="4" fill="#a78bfa" filter="url(#glow)">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.2s" path="M 755 235 C 805 235, 805 315, 855 315"/>
    </circle>

    <!-- Box 1: Vision Engine -->
    <g transform="translate(30, 85)">
      <rect width="295" height="125" rx="14" fill="rgba(16,24,39,0.9)" stroke="rgba(180,240,58,0.45)" stroke-width="1.5"/>
      <rect x="14" y="14" width="110" height="20" rx="6" fill="rgba(180,240,58,0.16)"/>
      <text x="23" y="28" fill="#b4f03a" font-size="10.5" font-weight="700">WEIGHT: 55%</text>
      <text x="14" y="54" fill="#f8fafc" font-size="15" font-weight="700">Vision Diagnostic Engine</text>
      <text x="14" y="75" fill="#cbd5e1" font-size="11.5">• MobileNetV3-Large (7 Classes, 98.28%)</text>
      <text x="14" y="93" fill="#cbd5e1" font-size="11.5">• LAB-Space CLAHE Enhancement</text>
      <text x="14" y="111" fill="#94a3b8" font-size="11">• Laplacian Blur &amp; Exposure Gate</text>
    </g>

    <!-- Box 2: Water Telemetry -->
    <g transform="translate(30, 240)">
      <rect width="295" height="135" rx="14" fill="rgba(16,24,39,0.9)" stroke="rgba(56,189,248,0.45)" stroke-width="1.5"/>
      <rect x="14" y="14" width="110" height="20" rx="6" fill="rgba(56,189,248,0.16)"/>
      <text x="23" y="28" fill="#38bdf8" font-size="10.5" font-weight="700">WEIGHT: 45%</text>
      <text x="14" y="54" fill="#f8fafc" font-size="15" font-weight="700">Water Quality Engine</text>
      <text x="14" y="75" fill="#cbd5e1" font-size="11.5">• Random Forest Hazard Regressor</text>
      <text x="14" y="93" fill="#cbd5e1" font-size="11.5">• Emerson Aqueous NH₃ Thermodynamics</text>
      <text x="14" y="111" fill="#cbd5e1" font-size="11.5">• Tier-1 FAO Biological Safety Guardrails</text>
      <text x="14" y="126" fill="#94a3b8" font-size="10.5">  (DO &lt; 2.0 mg/L or NH₃ &gt; 0.08 → ≥ 85)</text>
    </g>

    <!-- Center Box: Multimodal Fusion & Synergy -->
    <g transform="translate(455, 115)">
      <rect width="300" height="215" rx="16" fill="rgba(22,18,38,0.92)" stroke="rgba(139,92,246,0.65)" stroke-width="2" filter="url(#glow)"/>
      <rect x="18" y="16" width="178" height="22" rx="6" fill="rgba(139,92,246,0.22)"/>
      <text x="28" y="31" fill="#ddd6fe" font-size="10.5" font-weight="700">BIOLOGICAL SYNERGY CORE</text>
      <text x="18" y="60" fill="#ffffff" font-size="16.5" font-weight="800">Multimodal Risk Fusion</text>
      <text x="18" y="84" fill="#e2e8f0" font-size="11.5">Score = 0.55×Vision + 0.45×Water + Δ</text>
      <line x1="18" y1="98" x2="282" y2="98" stroke="rgba(255,255,255,0.1)"/>
      <text x="18" y="118" fill="#fdba74" font-size="11.5" font-weight="600">Pathogen-Environment Multipliers:</text>
      <text x="18" y="137" fill="#cbd5e1" font-size="11">• Gill Disease + Temp &gt;25.5°C &amp; pH &gt;8 (+20)</text>
      <text x="18" y="155" fill="#cbd5e1" font-size="11">• Saprolegniasis + Cold &lt;19.0°C (+18)</text>
      <text x="18" y="173" fill="#cbd5e1" font-size="11">• Aeromoniasis + High NH₃ / Hypoxia (+25)</text>
      <text x="18" y="191" fill="#cbd5e1" font-size="11">• Red Ulcer/EUS + Acidic pH &lt;6.8 (+20)</text>
      <text x="18" y="206" fill="#86efac" font-size="10.5">• Healthy + Balanced Equilibrium (-10)</text>
    </g>

    <!-- Output 1: Risk Score & Severity Tier -->
    <g transform="translate(855, 85)">
      <rect width="275" height="86" rx="12" fill="rgba(16,24,39,0.9)" stroke="rgba(180,240,58,0.4)"/>
      <text x="16" y="28" fill="#b4f03a" font-size="13.5" font-weight="700">Calibrated Risk Gauge (0–100)</text>
      <text x="16" y="49" fill="#cbd5e1" font-size="11.5">NORMAL · ADVISORY · WARNING · EMERGENCY</text>
      <text x="16" y="68" fill="#94a3b8" font-size="11">Explainable modality breakdown &amp; alerts</text>
    </g>

    <!-- Output 2: Dosage Calculator & Care Plan -->
    <g transform="translate(855, 182)">
      <rect width="275" height="86" rx="12" fill="rgba(16,24,39,0.9)" stroke="rgba(56,189,248,0.4)"/>
      <text x="16" y="28" fill="#38bdf8" font-size="13.5" font-weight="700">Non-Antibiotic Care &amp; Dosing</text>
      <text x="16" y="49" fill="#cbd5e1" font-size="11.5">Rock Salt (kg), Lime (CaCO₃), Water Flush</text>
      <text x="16" y="68" fill="#94a3b8" font-size="11">Aerator runtime &amp; copyable farm slip</text>
    </g>

    <!-- Output 3: Ledger & Multilingual UI -->
    <g transform="translate(855, 279)">
      <rect width="275" height="96" rx="12" fill="rgba(16,24,39,0.9)" stroke="rgba(167,139,250,0.4)"/>
      <text x="16" y="28" fill="#c4b5fd" font-size="13.5" font-weight="700">Surveillance Ledger &amp; 12 Langs</text>
      <text x="16" y="49" fill="#cbd5e1" font-size="11.5">Supabase / Local history, CSV &amp; JSON export</text>
      <text x="16" y="68" fill="#94a3b8" font-size="11">Full UI in English + 11 Indian languages</text>
      <text x="16" y="85" fill="#94a3b8" font-size="10.5">(हिन्दी, বাংলা, తెలుగు, தமிழ், മലയാളം, etc.)</text>
    </g>
  </g>
</svg>
