<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="AquaGuard AI Animated Banner">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030306"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>

    <radialGradient id="glow-lime" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b4f03a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#00b4d8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030306" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#030306" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030306" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ribbon-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="ribbon-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4f03a" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#b4f03a"/>
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .wave-1 {
      stroke-dasharray: 18 10;
      animation: flowForward 9s linear infinite;
    }
    .wave-2 {
      stroke-dasharray: 24 14;
      animation: flowBackward 12s linear infinite;
    }
    .pulse-ring {
      transform-origin: 185px 150px;
      animation: ringPulse 3.2s ease-in-out infinite;
    }
    .float-slow {
      animation: floatY 5s ease-in-out infinite;
    }
    @keyframes flowForward {
      from { stroke-dashoffset: 280; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowBackward {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 380; }
    }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.94); }
      50% { opacity: 0.9; transform: scale(1.06); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="340" rx="18" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- Ambient Glow Fields -->
  <ellipse cx="220" cy="240" rx="280" ry="180" fill="url(#glow-violet)">
    <animate attributeName="rx" values="260;310;260" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="620" cy="145" rx="340" ry="170" fill="url(#glow-lime)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1010" cy="120" rx="260" ry="170" fill="url(#glow-amber)">
    <animate attributeName="ry" values="155;190;155" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Subtle Technical Grid -->
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="960" y1="0" x2="960" y2="340"/>
  </g>

  <!-- Left Harmonic Ribbon Mesh -->
  <g fill="none" stroke="url(#ribbon-left)" filter="url(#soft-blur)">
    <path d="M -40 320 C 120 260, 240 160, 440 175 S 640 230, 820 120" stroke-width="1.4" opacity="0.55" class="wave-1"/>
    <path d="M -40 300 C 130 235, 250 140, 450 158 S 650 212, 835 102" stroke-width="1.2" opacity="0.45" class="wave-2"/>
    <path d="M -40 280 C 140 210, 260 120, 460 142 S 660 194, 850 84" stroke-width="1.0" opacity="0.35" class="wave-1"/>
    <path d="M -40 340 C 110 285, 230 180, 430 192 S 630 248, 805 138" stroke-width="1.1" opacity="0.40" class="wave-2"/>
  </g>

  <!-- Right Harmonic Ribbon Mesh -->
  <g fill="none" stroke="url(#ribbon-right)" filter="url(#soft-blur)">
    <path d="M 460 210 C 660 120, 820 250, 990 145 S 1130 55, 1240 80" stroke-width="1.5" opacity="0.6" class="wave-2"/>
    <path d="M 475 228 C 675 138, 835 268, 1005 162 S 1145 72, 1255 96" stroke-width="1.2" opacity="0.45" class="wave-1"/>
    <path d="M 445 192 C 645 102, 805 232, 975 128 S 1115 38, 1225 64" stroke-width="1.1" opacity="0.38" class="wave-2"/>
  </g>

  <!-- Animated Crest Emblem -->
  <g class="float-slow">
    <circle cx="185" cy="150" r="64" fill="rgba(180,240,58,0.06)" stroke="rgba(180,240,58,0.28)" stroke-width="1.5" class="pulse-ring"/>
    <circle cx="185" cy="150" r="50" fill="rgba(12,18,28,0.85)" stroke="rgba(0,180,216,0.55)" stroke-width="1.5"/>
    <!-- Stylized Fish + Pulse Wave Icon -->
    <g transform="translate(153,122)" fill="none" stroke="#b4f03a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 28c4-11 17-19 30-19 12 0 21 8 24 19-3 11-12 19-24 19-13 0-26-8-30-19Z"/>
      <path d="M4 20l8 8-8 8"/>
      <circle cx="51" cy="24" r="2.2" fill="#00b4d8" stroke="none"/>
      <path d="M23 28h7l3-5 4 10 3-5h6" stroke="#00b4d8" stroke-width="2.2"/>
    </g>
  </g>

  <!-- Hero Typography & Pills -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Status Badge -->
    <rect x="280" y="72" width="290" height="28" rx="14" fill="rgba(180,240,58,0.11)" stroke="rgba(180,240,58,0.38)" stroke-width="1"/>
    <circle cx="298" cy="86" r="4.5" fill="#b4f03a">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="311" y="90.5" fill="#d9f99d" font-size="11.5" font-weight="700" letter-spacing="0.9">
      MULTIMODAL AQUACULTURE GUARDIAN
    </text>

    <!-- Main Title -->
    <text x="280" y="154" fill="url(#title-grad)" font-size="56" font-weight="800" letter-spacing="-1.4">
      AquaGuard <tspan fill="#b4f03a">AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="282" y="192" fill="#cbd5e1" font-size="18.5" font-weight="500">
      Early Fish Disease Diagnostics, Water Hazard Telemetry &amp; Antibiotic-Free Pond Care
    </text>

    <!-- Feature Metric Chips -->
    <g transform="translate(280, 224)">
      <rect x="0" y="0" width="176" height="42" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(180,240,58,0.32)"/>
      <text x="14" y="17" fill="#94a3b8" font-size="10" font-weight="600">VISION ENGINE</text>
      <text x="14" y="33" fill="#b4f03a" font-size="13" font-weight="700">98.28% MobileNetV3</text>

      <rect x="190" y="0" width="186" height="42" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(0,180,216,0.35)"/>
      <text x="204" y="17" fill="#94a3b8" font-size="10" font-weight="600">WATER TELEMETRY</text>
      <text x="204" y="33" fill="#38bdf8" font-size="13" font-weight="700">Random Forest + NH₃</text>

      <rect x="390" y="0" width="176" height="42" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(139,92,246,0.4)"/>
      <text x="404" y="17" fill="#94a3b8" font-size="10" font-weight="600">ACCESSIBILITY</text>
      <text x="404" y="33" fill="#c4b5fd" font-size="13" font-weight="700">12 Indian Languages</text>

      <rect x="580" y="0" width="186" height="42" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(249,115,22,0.4)"/>
      <text x="594" y="17" fill="#94a3b8" font-size="10" font-weight="600">REMEDIATION</text>
      <text x="594" y="33" fill="#fdba74" font-size="13" font-weight="700">Zero-Antibiotic Dosing</text>
    </g>
  </g>
</svg>
